name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/blood-donation-client/package-lock.json

      - name: Install dependencies
        working-directory: frontend/blood-donation-client
        run: npm ci

      - name: Build Angular
        working-directory: frontend/blood-donation-client
        run: npm run build -- --base-href /Blood-Donation-Management-System/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/blood-donation-client/dist/blood-donation-client/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
