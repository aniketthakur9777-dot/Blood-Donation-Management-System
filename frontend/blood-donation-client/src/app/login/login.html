<div class="login-container">
  <div class="login-card">

    <h2>Blood Donation Management System</h2>

    <input
      type="email"
      placeholder="Enter Email"
      [(ngModel)]="email">

    <input
      type="password"
      placeholder="Enter Password"
      [(ngModel)]="password">

    <button (click)="login()">
      Login
    </button>

    <p>
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>
</div>
